[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskflow-testkit"
version = "0.1.0"
description = "Shared test substrate for TaskFlow: factories, transports, fixtures, selectors."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyyaml>=6.0"]

# Registering as a pytest plugin is what makes this a substrate rather than
# a utility module: every suite gets the fixtures from `pip install -e`,
# with no conftest copy-paste and no sys.path games.
[project.entry-points.pytest11]
testkit = "testkit.fixtures"

[tool.setuptools.packages.find]
where = ["src"]
